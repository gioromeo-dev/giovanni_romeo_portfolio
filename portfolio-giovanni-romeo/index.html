<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Giovanni Romeo — Full-stack developer & designer crafting interfaces that feel sharp, fast, and considered." />
    <meta name="author" content="Giovanni Romeo" />
    <meta name="theme-color" content="#010101" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#adadad" media="(prefers-color-scheme: light)" />

    <meta property="og:title" content="Giovanni Romeo — Portfolio" />
    <meta property="og:description" content="Full-stack developer & designer. Building thoughtful tools for the web." />
    <meta property="og:type" content="website" />

    <title>Giovanni Romeo — Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Set theme + lang BEFORE paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio.theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("portfolio.lang") || "en";
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
